<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="screen active">
    <div class="login-bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
    <div class="login-card">
      <div class="login-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </div>
      <h1 class="login-title">Remote Desktop</h1>
      <p class="login-subtitle">Enter password to connect</p>
      <form id="login-form" autocomplete="off">
        <div class="input-group">
          <input
            type="password"
            id="password-input"
            placeholder="Password"
            autocomplete="off"
            required
          />
          <button type="submit" id="connect-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="m12 5 7 7-7 7"/>
            </svg>
          </button>
        </div>
        <p id="login-error" class="error-text"></p>
      </form>
    </div>
  </div>

  <!-- Remote Desktop View -->
  <div id="desktop-screen" class="screen">
    <!-- Top bar -->
    <div id="toolbar">
      <div class="toolbar-left">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Connected</span>
      </div>
      <div class="toolbar-center">
        <span id="fps-counter">0 FPS</span>
        <span class="separator">|</span>
        <span id="latency-display">0ms</span>
      </div>
      <div class="toolbar-right">
        <button id="fullscreen-btn" class="toolbar-btn" title="Toggle Fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"/>
            <polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/>
            <line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>
        <button id="disconnect-btn" class="toolbar-btn danger" title="Disconnect">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Canvas container -->
    <div id="canvas-container">
      <canvas id="remote-canvas"></canvas>
    </div>
  </div>

  <!-- Reconnect overlay -->
  <div id="reconnect-overlay" class="overlay">
    <div class="overlay-content">
      <div class="spinner"></div>
      <p>Connection lost. Reconnecting...</p>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
